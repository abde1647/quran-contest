<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>مسابقة القرآن الكريم السنوية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مسابقة القرآن">
<meta name="theme-color" content="#0f5c4d">
<style>
/* Layout: a register book — narrow masthead, level tabs as a ribbon, one ledger table per level, results as an honour roll. */
:root{
  --bg:#f6f7f4; --surface:#ffffff; --sunk:#eceee8; --line:#d9ddd3;
  --ink:#1b2a26; --muted:#5d6b66;
  --accent:#0f5c4d; --accent-soft:#e0eee9; --on-accent:#ffffff;
  --gold:#a8791c; --silver:#6f7a80; --bronze:#9a5a32;
  --warn:#b04a2f;
  --display:"Amiri", "Traditional Arabic", serif;
  --body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#18211e; --sunk:#0d1311; --line:#2a3632;
  --ink:#e6ece9; --muted:#9aa9a3;
  --accent:#4fb59c; --accent-soft:#1a3029; --on-accent:#08201a;
  --gold:#e0b04f; --silver:#b4bec3; --bronze:#d38a5c; --warn:#ef8a6e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18211e; --sunk:#0d1311; --line:#2a3632;
  --ink:#e6ece9; --muted:#9aa9a3;
  --accent:#4fb59c; --accent-soft:#1a3029; --on-accent:#08201a;
  --gold:#e0b04f; --silver:#b4bec3; --bronze:#d38a5c; --warn:#ef8a6e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header.mast{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--accent);padding-bottom:12px}
header.mast h1{font-family:var(--display);font-size:clamp(1.7rem,4vw,2.3rem);margin:0;line-height:1.2;text-wrap:balance}
header.mast p{margin:0;color:var(--muted)}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{height:64px;width:auto;background:#fff;border-radius:10px;padding:4px 8px}
.status{font-size:.82rem;color:var(--muted)}
.status.err{color:var(--warn)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.92rem;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button.main{font-weight:600}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
nav.tabs .sep{flex:0 0 1px;background:var(--line);margin:4px 2px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-family:var(--display);font-size:1.6rem;margin:0;line-height:1.3}
.sub{color:var(--muted);margin:0;font-size:.9rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{color:var(--muted);font-size:.85rem}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--sunk);font-weight:600;font-size:.85rem;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:center}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--accent-soft)}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;margin-inline-start:8px}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:.8rem;font-weight:600;border:1px solid currentColor}
.p1{color:var(--gold)}.p2{color:var(--silver)}.p3{color:var(--bronze)}.p0{color:var(--muted);border-color:var(--line);font-weight:400}
.pend{color:var(--muted);font-size:.82rem}
input.mark{width:62px;text-align:center;font:inherit;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input.mark.bad{border-color:var(--warn)}
input.name{width:100%;min-width:180px;font:inherit;padding:5px 8px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink)}
input.name:hover,input.name:focus{border-color:var(--line);background:var(--bg)}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:2px 6px;border-radius:6px}
.del:hover{color:var(--warn);background:var(--sunk)}
.del.confirm{color:var(--warn);font-size:.8rem;font-weight:600}
form.add{display:flex;flex-wrap:wrap;gap:8px;align-items:end;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px}
form.add label{display:grid;gap:2px;font-size:.8rem;color:var(--muted)}
form.add label.grow{flex:1 1 200px}
form.add input{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
form.add input[type=number]{width:90px}
.btn{font:inherit;font-weight:600;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.podium div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.podium small{display:block;font-weight:600}
.podium strong{display:block;font-family:var(--display);font-size:1.2rem;overflow-wrap:anywhere}
.podium em{font-style:normal;color:var(--muted);font-size:.85rem}
.honour{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;min-width:0}
.card h3{margin:0;font-family:var(--display);font-size:1.3rem}
.card ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.card li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.card li .n{overflow-wrap:anywhere}
.card li .s{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.empty{padding:24px;text-align:center;color:var(--muted)}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.note{font-size:.85rem;color:var(--muted);margin:0}
.banner{background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:.88rem}
.certs{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px;min-width:0}
.panel h3{margin:0;font-size:1rem}
.field{display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.field input,.field select{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:.88rem;padding:6px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.clist{display:grid;gap:4px;max-height:420px;overflow-y:auto}
.clist button.item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:right;font:inherit;padding:7px 10px;border:1px solid transparent;border-radius:8px;background:none;color:var(--ink);cursor:pointer}
.clist button.item:hover{background:var(--sunk)}
.clist button.item[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.preview canvas{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 1px 0 var(--line),0 6px 24px rgba(0,0,0,.12)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.side{display:grid;gap:6px;justify-items:end}
.userbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end;font-size:.88rem}
.userbox .who{font-weight:600}
.userbox .role{color:var(--muted)}
.btn.small{padding:4px 12px;font-size:.85rem}
.login{max-width:420px;margin:24px auto;display:grid;gap:14px}
.login form{display:grid;gap:12px}
.login .err{color:var(--warn);font-size:.9rem;min-height:1.2em;margin:0}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.15rem;letter-spacing:.12em;background:var(--sunk);padding:4px 10px;border-radius:6px;user-select:all;direction:ltr;display:inline-block}
.prog{display:inline-block;width:90px;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;vertical-align:middle;margin-inline-start:8px}
.prog i{display:block;height:100%;background:var(--accent)}
.state{font-size:.8rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.state.on{color:var(--accent);border-color:var(--accent)}
.loglist{display:grid;gap:0}
.loglist li{list-style:none;padding:9px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.loglist li:last-child{border-bottom:0}
.loglist time{color:var(--muted);font-size:.8rem;white-space:nowrap}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
@media (max-width:560px){th,td{padding:8px 6px}input.name{min-width:118px;padding:5px 4px}input.mark{width:50px;padding:5px 2px}td.num.pend:first-child,th.num:first-child{display:none}.podium div{padding:8px 12px}}
@media (max-width:560px){header.mast{align-items:start}.side{justify-items:start}.userbox{justify-content:flex-start}}
@media (max-width:760px){.certs{grid-template-columns:1fr}}
@media (max-width:560px){.podium{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="wrap" dir="rtl" lang="ar">
  <header class="mast">
    <div class="brand"><img class="logo" src="" id="mastLogo" alt="شعار مدرسة الإخلاص القرآنية"><div>
      <h1>مسابقة القرآن الكريم السنوية</h1>
      <p>التنقيط: الحفظ ‎/10‎ + التلاوة والتجويد ‎/10‎ = المجموع ‎/20‎</p>
    </div></div>
    <div class="side"><div class="userbox" id="userbox" hidden></div><div class="status" id="status">جارٍ تحميل البيانات…</div></div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>

<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="lib/firebase-app-compat.js"></script>
<script src="lib/firebase-auth-compat.js"></script>
<script src="lib/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="core.js"></script>
<script src="cloud.js"></script>


</body></html>
